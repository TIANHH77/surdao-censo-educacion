version: '3.8'

services:
  agente-surdao:
    build: .
    container_name: censo-agente-surdao
    ports:
      - "8501:8501"
    volumes:
      # Conecta tu carpeta local 'data' al contenedor (¡clave para leer los Parquet!)
      - ./data:/app/data
    env_file:
      - .env
    # Esto es CRÍTICO para que el contenedor pueda acceder a tu Ollama local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always